    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmurfPakad" />

    <meta property="og:title" content="Vyapaar Kavach | Privacy-Preserving Merchant Dispute Resolution" />

    <!-- Font preloads -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  </head>

  <body>
    <div id="error-overlay" style="display:none; position:fixed; z-index:9999; background:red; color:white; padding:20px; top:0; left:0; right:0;"></div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var el = document.getElementById('error-overlay');
        el.style.display = 'block';
        el.innerHTML += '<p>' + msg + '<br/>' + url + ':' + lineNo + ':' + columnNo + '<br/>' + (error && error.stack ? error.stack : '') + '</p>';
        return false;
      };
      window.onunhandledrejection = function(event) {
        var el = document.getElementById('error-overlay');
        el.style.display = 'block';
        el.innerHTML += '<p>Unhandled Promise Rejection: ' + event.reason + '</p>';
      };
    </script>
    <div id="root"></div>
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <!-- <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script> -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Vyapaar Kavach SW registered:', reg.scope))
            .catch(err => console.warn('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>

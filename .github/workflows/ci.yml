name: Vyapaar Kavach CI / CD Pipeline

on:
  push:
    branches: [ main, dev, feat/* ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-test:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
          pip install -r Backend/tests/requirements-test.txt

      - name: Run Backend Tests
        run: |
          cd Backend
          python -m pytest tests/test_vyapaar.py -v --tb=short

      - name: Check Code Quality (Flake8 / Black)
        run: |
          pip install flake8
          flake8 Backend/app/routers/vyapaar_*.py --count --max-line-length=130 --statistics || true

  build-validation:
    name: Frontend Typecheck & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Run Frontend Build
        run: npm run build
